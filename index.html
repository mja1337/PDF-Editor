<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="pdfe is a private, local-first PDF workspace that runs entirely in your browser."
    />
    <meta name="theme-color" content="#101715" />
    <meta name="color-scheme" content="dark light" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; img-src 'self' data: blob:; font-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <title>pdfe</title>
    <link rel="icon" href="%BASE_URL%icon.svg" type="image/svg+xml" sizes="any" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      try {
        ;['pdfe.preferences', 'pdf-editor.preferences'].forEach(function (key) {
          localStorage.removeItem(key)
        })
      } catch (_error) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
